<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking Documents | Scorpion_Jr</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body><main class="site-shell"><div class="container"><a class="back" href="index.html">← Scorpion_Jr</a><section class="hero-card"><span class="eyebrow">BOOKING DOCUMENTS</span><h1>Your quotation & invoice.</h1><div id="status" class="card">Loading your booking documents…</div><div id="actions" class="doc-actions hidden"></div><div id="preview" class="document-preview hidden"></div></section></div></main><script src="js/supabase.js"></script><script>
const token=new URLSearchParams(location.search).get('token');let packet=null,currentType='quotation';
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
const money=v=>Number(v||0).toLocaleString('en-SZ',{minimumFractionDigits:2,maximumFractionDigits:2});
const date=v=>v?new Date(v+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'}):'—';
const dt=v=>v?new Date(v).toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'}):'—';
(async()=>{if(!token){return fail('Invalid document link.');}const {data,error}=await supabaseClient.rpc('get_customer_documents',{p_token:token});if(error||!data){return fail('This document link is invalid or expired.');}packet=data;render();})();
function fail(t){document.getElementById('status').textContent=t;}
function render(){const b=packet.booking,q=packet.quotation,i=packet.invoice;document.getElementById('status').innerHTML=`<h2>${esc(b.client_name)}</h2><p><b>${esc(b.event_type)}</b><br>${date(b.event_date)} · ${String(b.start_time||'').slice(0,5)}–${String(b.end_time||'').slice(0,5)}<br>${esc(b.venue)}, ${esc(b.location)}</p><p class="muted">Booking status: ${esc(b.status)}</p>`;const actions=document.getElementById('actions');actions.classList.remove('hidden');actions.innerHTML=(q?`<button class="btn" onclick="showDoc('quotation')">VIEW QUOTATION</button><button class="btn secondary" onclick="downloadDoc('quotation')">DOWNLOAD QUOTATION PDF</button>`:'')+(i?`<button class="btn" onclick="showDoc('invoice')">VIEW INVOICE</button><button class="btn secondary" onclick="downloadDoc('invoice')">DOWNLOAD INVOICE PDF</button>`:'');if(!q&&!i)document.getElementById('status').insertAdjacentHTML('beforeend','<p>Your quotation is not available yet. It will appear here after your booking is accepted.</p>');else showDoc(i?'invoice':'quotation');}
function docData(type){return type==='invoice'?packet.invoice:packet.quotation;}
function showDoc(type){currentType=type;const b=packet.booking,d=docData(type),i=packet.invoice,q=packet.quotation,payments=packet.payments||[];const isInvoice=type==='invoice';const paid=payments.filter(p=>p.payment_status==='PAID').reduce((s,p)=>s+Number(p.amount||0),0);const balance=Math.max(Number(b.total_amount||d.total_amount||0)-paid,0);const title=isInvoice?'INVOICE':'DJ BOOKING QUOTATION';const number=isInvoice?d.invoice_number:d.quotation_number;document.getElementById('preview').classList.remove('hidden');document.getElementById('preview').innerHTML=`<div class="doc-top"><div><img class="doc-logo" src="assets/logo.png" alt="Scorpion_Jr"></div><div><h1>${title}</h1><div class="doc-gold">${esc(number)}</div></div></div><div class="doc-meta"><div><b>CLIENT NAME</b><br>${esc(b.client_name)}<br><br><b>EVENT NAME</b><br>${esc(b.event_type)}<br><br><b>VENUE</b><br>${esc(b.venue)}, ${esc(b.location)}<br><br><b>PERFORMANCE TIME</b><br>${String(b.start_time||'').slice(0,5)}–${String(b.end_time||'').slice(0,5)}</div><div><b>${isInvoice?'INVOICE DATE':'QUOTATION DATE'}</b><br>${isInvoice?dt(d.issued_at):dt(d.issued_at)}<br><br><b>${isInvoice?'DUE DATE':'VALID UNTIL'}</b><br>${isInvoice?date(d.due_date):date(d.valid_until)}<br><br><b>EVENT DATE</b><br>${date(b.event_date)}</div></div><div style="margin-top:25px"><div class="doc-box"><b>SERVICE DESCRIPTION</b><p>${esc(q?.service_description||'Professional DJ performance and entertainment services for the specified event.')}</p><small>DJ services only. Sound equipment, lighting, staging and other technical requirements are not included unless separately agreed in writing.</small></div></div><table class="doc-table"><thead><tr><th>Description</th><th>Amount</th></tr></thead><tbody><tr><td>DJ Performance — ${esc(b.event_type)}</td><td>E ${money(b.total_amount||d.total_amount)}</td></tr>${isInvoice&&paid?`<tr><td>Payments received</td><td>− E ${money(paid)}</td></tr>`:''}</tbody></table><div class="doc-box" style="margin-top:20px"><div class="doc-total">${isInvoice?'BALANCE DUE':'BOOKING FEE'}: E ${money(isInvoice?balance:b.total_amount||d.total_amount)}</div>${!isInvoice?`<p>Deposit required: <b>E ${money(b.deposit_amount||d.deposit_amount)}</b></p>`:`<p>Amount paid: <b>E ${money(paid)}</b></p>`}</div>${!isInvoice?`<div style="margin-top:25px"><b>PAYMENT TERMS</b><ul class="doc-list">${String(d.terms||'').split('\n').filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><b>ARTIST RIDER REQUIREMENTS</b><p>${esc(d.artist_rider||'')}</p></div>`:`<div style="margin-top:25px"><b>PAYMENT HISTORY</b>${payments.length?`<table class="doc-table"><thead><tr><th>Date</th><th>Method</th><th>Reference</th><th>Amount</th><th>Status</th></tr></thead><tbody>${payments.map(p=>`<tr><td>${dt(p.created_at)}</td><td>${esc(p.payment_method)}</td><td>${esc(p.reference||'—')}</td><td>E ${money(p.amount)}</td><td>${esc(p.payment_status)}</td></tr>`).join('')}</tbody></table>`:'<p>No payments recorded.</p>'}</div>`}<div class="doc-footer"><b>SCORPION_JR</b><br>AFROHOUSE • 3-STEP • DJ • PRODUCER<br>+268 7945 3651 · andiswamdluli421@gmail.com<br><br>DJ service only. Sound, lighting and other equipment are not included unless separately agreed.</div><div class="doc-sign"><div>CLIENT NAME: ______________________________<br><br>SIGNATURE: _________________________________<br><br>DATE: ______________________________________</div><div style="text-align:center;font-size:24px;font-style:italic;padding-top:15px">Thank You!<br><small style="font-size:12px;font-style:normal">FOR CONSIDERING SCORPION_JR</small></div></div>`;}
function downloadDoc(type){const b=packet.booking,d=docData(type),i=type==='invoice',payments=packet.payments||[];const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4'});let y=18;pdf.setFillColor(8,8,8);pdf.rect(0,0,210,34,'F');pdf.setTextColor(255,255,255);pdf.setFontSize(22);pdf.setFont(undefined,'bold');pdf.text('SCORPION_JR',15,17);pdf.setFontSize(10);pdf.setTextColor(255,45,60);pdf.text('AFROHOUSE • 3-STEP • DJ • PRODUCER',15,25);pdf.setTextColor(255,255,255);pdf.setFontSize(16);pdf.text(i?'INVOICE':'DJ BOOKING QUOTATION',135,15);pdf.setFontSize(10);pdf.text(i?d.invoice_number:d.quotation_number,135,23);y=45;pdf.setTextColor(25,25,25);pdf.setFontSize(10);pdf.setFont(undefined,'bold');pdf.text('CLIENT',15,y);pdf.setFont(undefined,'normal');pdf.text(b.client_name,15,y+6);pdf.text('EVENT',15,y+15);pdf.text(b.event_type,15,y+21);pdf.text('VENUE',15,y+30);pdf.text(`${b.venue}, ${b.location}`,15,y+36);pdf.text('EVENT DATE',120,y);pdf.text(date(b.event_date),120,y+6);pdf.text('TIME',120,y+15);pdf.text(`${String(b.start_time||'').slice(0,5)}–${String(b.end_time||'').slice(0,5)}`,120,y+21);pdf.text(i?'DUE DATE':'VALID UNTIL',120,y+30);pdf.text(date(i?d.due_date:d.valid_until),120,y+36);y+=55;pdf.setDrawColor(167,124,24);pdf.line(15,y,195,y);y+=12;pdf.setFont(undefined,'bold');pdf.text('SERVICE DESCRIPTION',15,y);pdf.setFont(undefined,'normal');const desc=pdf.splitTextToSize('Professional DJ performance and entertainment services for the specified event. DJ services only; sound equipment, lighting, staging and other technical requirements are not included unless separately agreed in writing.',180);pdf.text(desc,15,y+7);y+=7+desc.length*5+8;pdf.setFont(undefined,'bold');pdf.text('BOOKING FEE',15,y);pdf.text(`E ${money(b.total_amount||d.total_amount)}`,155,y);y+=12;if(i){const paid=payments.filter(p=>p.payment_status==='PAID').reduce((s,p)=>s+Number(p.amount||0),0);pdf.setFont(undefined,'normal');pdf.text('Payments received',15,y);pdf.text(`E ${money(paid)}`,155,y);y+=10;pdf.setFont(undefined,'bold');pdf.text('BALANCE DUE',15,y);pdf.text(`E ${money(Math.max(Number(b.total_amount||d.total_amount)-paid,0))}`,155,y);y+=16;}else{pdf.setFont(undefined,'normal');pdf.text('Deposit required',15,y);pdf.text(`E ${money(b.deposit_amount||d.deposit_amount)}`,155,y);y+=16;pdf.setFont(undefined,'bold');pdf.text('PAYMENT TERMS',15,y);pdf.setFont(undefined,'normal');const terms=pdf.splitTextToSize(String(d.terms||'').replace(/\n/g,' • '),180);pdf.text(terms,15,y+7);y+=7+terms.length*5+8;pdf.setFont(undefined,'bold');pdf.text('ARTIST RIDER REQUIREMENTS',15,y);pdf.setFont(undefined,'normal');const rider=pdf.splitTextToSize(String(d.artist_rider||''),180);pdf.text(rider,15,y+7);y+=7+rider.length*5+8;}pdf.setDrawColor(190,190,190);pdf.line(15,265,195,265);pdf.setFontSize(8);pdf.text('SCORPION_JR · +268 7945 3651 · andiswamdluli421@gmail.com',15,273);pdf.text('DJ service only. Sound, lighting and other equipment are not included unless separately agreed.',15,279);pdf.save(`${i?d.invoice_number:d.quotation_number}-Scorpion_Jr.pdf`);}
</script></body></html>
