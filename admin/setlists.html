<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setlists | Scorpion_Jr</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="admin-shell"><div class="container admin-main"></div></main><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/admin.js"></script><script>
let tracks=[],lists=[];(async()=>{if(!await loadAdminShell())return;await render();})();
async function render(){const [tr,sl]=await Promise.all([supabaseClient.from('music_tracks').select('*').order('created_at',{ascending:false}),supabaseClient.from('setlists').select('*').order('created_at',{ascending:false})]);tracks=tr.data||[];lists=sl.data||[];const main=document.querySelector('.admin-main');main.insertAdjacentHTML('beforeend',`<section><div class="page-head"><div><span class="eyebrow">DJ TOOLS</span><h1>Setlist Builder</h1><p class="muted">Build reusable music libraries and show-ready setlists.</p></div></div><div class="grid"><div class="card"><h2>Music Library</h2><form id="trackForm" class="form-grid"><div><label>Track title</label><input name="title" required></div><div><label>Artist</label><input name="artist"></div><div><label>BPM</label><input name="bpm" type="number" step="0.01"></div><div><label>Key</label><input name="musical_key" placeholder="Am"></div><div><label>Genre</label><input name="genre" placeholder="AfroHouse"></div><div><label>Energy (1–10)</label><input name="energy" type="number" min="1" max="10"></div><div class="full"><label>Notes</label><input name="notes"></div><div class="full"><button class="btn">ADD TRACK</button><span id="trackMsg"></span></div></form><div id="tracks" style="margin-top:20px"></div></div><div class="card"><h2>Create Setlist</h2><form id="setlistForm"><label>Name</label><input name="name" required placeholder="Saturday Night AfroHouse"><label>Notes</label><textarea name="notes"></textarea><button class="btn">CREATE SETLIST</button><p id="setMsg"></p></form><hr><div id="lists"></div></div></div></section>`);renderTracks();renderLists();document.getElementById('trackForm').addEventListener('submit',addTrack);document.getElementById('setlistForm').addEventListener('submit',addSetlist);}
function renderTracks(){document.getElementById('tracks').innerHTML=tracks.map(t=>`<div class="list-row"><div><strong>${esc(t.title)}</strong><div class="muted">${esc(t.artist||'—')} · ${esc(t.bpm||'—')} BPM · ${esc(t.musical_key||'—')} · ${esc(t.genre||'—')}</div></div><span class="status">${esc(t.energy||'—')}/10</span></div>`).join('')||'<p class="muted">No tracks yet.</p>';}
function renderLists(){document.getElementById('lists').innerHTML=lists.map(l=>`<div class="card" style="margin-top:12px"><div class="card-head"><div><strong>${esc(l.name)}</strong><div class="muted">${esc(l.notes||'')}</div></div><button class="btn small" onclick="openList('${l.id}')">EDIT</button></div></div>`).join('')||'<p class="muted">No setlists yet.</p>';}
async function addTrack(e){e.preventDefault();const fd=new FormData(e.target);const payload={title:fd.get('title').trim(),artist:fd.get('artist').trim()||null,bpm:fd.get('bpm')?Number(fd.get('bpm')):null,musical_key:fd.get('musical_key').trim()||null,genre:fd.get('genre').trim()||null,energy:fd.get('energy')?Number(fd.get('energy')):null,notes:fd.get('notes').trim()||null};const {error}=await supabaseClient.from('music_tracks').insert(payload);document.getElementById('trackMsg').textContent=error?error.message:' Added.';if(!error){e.target.reset();const {data}=await supabaseClient.from('music_tracks').select('*').order('created_at',{ascending:false});tracks=data||[];renderTracks();}}
async function addSetlist(e){e.preventDefault();const fd=new FormData(e.target);const {error}=await supabaseClient.from('setlists').insert({name:fd.get('name').trim(),notes:fd.get('notes').trim()||null});document.getElementById('setMsg').textContent=error?error.message:' Setlist created.';if(!error){e.target.reset();const {data}=await supabaseClient.from('setlists').select('*').order('created_at',{ascending:false});lists=data||[];renderLists();}}
async function openList(id){const l=lists.find(x=>x.id===id);const {data:rows}=await supabaseClient.from('setlist_tracks').select('id,position,notes,music_tracks(*)').eq('setlist_id',id).order('position');const current=rows||[];const options=tracks.filter(t=>!current.some(r=>r.track_id===t.id)).map(t=>`<option value="${t.id}">${esc(t.title)} — ${esc(t.artist||'')}</option>`).join('');document.getElementById('lists').innerHTML=`<div class="card"><button class="btn secondary" onclick="renderLists()">← Back</button><h2>${esc(l.name)}</h2><p class="muted">${esc(l.notes||'')}</p>${current.map(r=>`<div class="setlist-track"><span class="track-num">${r.position}</span><div><strong>${esc(r.music_tracks.title)}</strong><div class="muted">${esc(r.music_tracks.artist||'')} · ${esc(r.music_tracks.bpm||'—')} BPM · ${esc(r.music_tracks.musical_key||'—')}</div></div><span class="track-meta">${esc(r.music_tracks.genre||'')}</span><button class="btn small" onclick="removeTrack('${r.id}','${id}')">REMOVE</button></div>`).join('')||'<p class="muted">No tracks in this setlist.</p>'}<hr><label>Add track</label><select id="addTrackSelect"><option value="">Select a track</option>${options}</select><button class="btn" style="margin-top:10px" onclick="addToSet('${id}')">ADD TO SETLIST</button></div>`;}
async function addToSet(id){const trackId=document.getElementById('addTrackSelect').value;if(!trackId)return;const {data:max}=await supabaseClient.from('setlist_tracks').select('position').eq('setlist_id',id).order('position',{ascending:false}).limit(1);const pos=(max?.[0]?.position||0)+1;const {error}=await supabaseClient.from('setlist_tracks').insert({setlist_id:id,track_id:trackId,position:pos});if(error)alert(error.message);await openList(id);}
async function removeTrack(rowId,id){await supabaseClient.from('setlist_tracks').delete().eq('id',rowId);await openList(id);}
</script></body></html>
