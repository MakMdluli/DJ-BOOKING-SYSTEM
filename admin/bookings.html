<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookings | Scorpion_Jr</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="admin-shell"><div class="container admin-main"></div></main><div id="modal" class="modal hidden"><div class="modal-box"><button class="modal-close" onclick="closeModal()">×</button><div id="detail"></div></div></div><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/admin.js"></script><script>
let bookings=[];(async()=>{if(!await loadAdminShell())return;await render();})();
async function render(){const {data,error}=await supabaseClient.from('bookings').select('*, packages(name)').order('event_date',{ascending:true});bookings=data||[];const main=document.querySelector('.admin-main');main.insertAdjacentHTML('beforeend',`<section><div class="page-head"><div><span class="eyebrow">BOOKINGS</span><h1>Booking Requests</h1><p class="muted">A booking is confirmed only after the required payment is verified.</p></div><select id="filter" onchange="filterRows()" class="filter"><option value="ALL">All statuses</option>${['PENDING','ACCEPTED','AWAITING_PAYMENT','CONFIRMED','COMPLETED','DECLINED','CANCELLED'].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Client</th><th>Event</th><th>Time</th><th>Package</th><th>Status</th><th></th></tr></thead><tbody id="bookingRows"></tbody></table></div></section>`);filterRows();}
function filterRows(){const f=document.getElementById('filter').value;const rows=bookings.filter(x=>f==='ALL'||x.status===f);document.getElementById('bookingRows').innerHTML=rows.map(x=>`<tr><td>${fmtDate(x.event_date)}</td><td><strong>${esc(x.client_name)}</strong><div class="muted">${esc(x.whatsapp)}</div></td><td>${esc(x.event_type)}<div class="muted">${esc(x.venue)}</div></td><td>${fmtTime(x.start_time)}–${fmtTime(x.end_time)}</td><td>${esc(x.packages?.name||'—')}</td><td><span class="${statusClass(x.status)}">${esc(x.status)}</span></td><td><button class="btn small" onclick="openBooking('${x.id}')">Manage</button></td></tr>`).join('')||'<tr><td colspan="7" class="muted">No bookings match this filter.</td></tr>';}
async function openBooking(id){const b=bookings.find(x=>x.id===id);if(!b)return;const {data:payments}=await supabaseClient.from('payments').select('*').eq('booking_id',id).order('created_at',{ascending:false});document.getElementById('detail').innerHTML=`<span class="eyebrow">BOOKING</span><h2>${esc(b.client_name)}</h2><div class="detail-grid"><div><b>Event</b><span>${esc(b.event_type)}</span></div><div><b>Date</b><span>${fmtDate(b.event_date)}</span></div><div><b>Time</b><span>${fmtTime(b.start_time)}–${fmtTime(b.end_time)}</span></div><div><b>Venue</b><span>${esc(b.venue)}</span></div><div><b>Location</b><span>${esc(b.location)}</span></div><div><b>Guests</b><span>${esc(b.guest_count||'—')}</span></div><div><b>WhatsApp</b><span>${esc(b.whatsapp)}</span></div><div><b>Email</b><span>${esc(b.email)}</span></div></div><div class="notice">DJ service only. Sound, lighting and other equipment are not included unless separately agreed.</div><label>Workflow status</label><select id="mStatus"><option ${b.status==='PENDING'?'selected':''}>PENDING</option><option ${b.status==='ACCEPTED'?'selected':''}>ACCEPTED</option><option ${b.status==='AWAITING_PAYMENT'?'selected':''}>AWAITING_PAYMENT</option><option ${b.status==='CONFIRMED'?'selected':''} disabled>CONFIRMED — payment verified</option><option ${b.status==='COMPLETED'?'selected':''}>COMPLETED</option><option ${b.status==='DECLINED'?'selected':''}>DECLINED</option><option ${b.status==='CANCELLED'?'selected':''}>CANCELLED</option></select><div class="form-grid compact"><div><label>Total quote</label><input id="mTotal" type="number" min="0" step="0.01" value="${b.total_amount??''}"></div><div><label>Deposit required</label><input id="mDeposit" type="number" min="0" step="0.01" value="${b.deposit_amount??0}"></div></div><label>Notes</label><textarea id="mNotes">${esc(b.notes||'')}</textarea><p id="mMsg"></p><div class="actions"><button class="btn" onclick="saveBooking('${b.id}')">Save changes</button>${['ACCEPTED','AWAITING_PAYMENT','CONFIRMED','COMPLETED'].includes(b.status)?`<a class="btn secondary" href="../documents.html?token=${b.payment_token}" target="_blank">View quotation / invoice</a>`:''}${b.status==='AWAITING_PAYMENT'?`<a class="btn" href="../pay.html?token=${b.payment_token}" target="_blank">Open payment page</a>`:''}<a class="btn secondary" target="_blank" href="https://wa.me/${String(b.whatsapp||'').replace(/\D/g,'')}">WhatsApp client</a></div><hr><h3>Payment history</h3>${(payments||[]).map(p=>`<div class="list-row"><div><strong>${esc(p.payment_method||'BANK')}</strong><div class="muted">${esc(p.reference||'No reference')} · ${new Date(p.created_at).toLocaleString()}</div></div><span class="${statusClass(p.payment_status)}">E ${money(p.amount)} · ${esc(p.payment_status)}</span>${p.payment_status==='PENDING'?`<button class="btn small" onclick="verifyPayment('${p.id}')">Verify</button>`:''}</div>`).join('')||'<p class="muted">No payment attempts yet.</p>'}`;document.getElementById('modal').classList.remove('hidden');}
async function saveBooking(id){const msg=document.getElementById('mMsg');msg.textContent='Saving...';let status=document.getElementById('mStatus').value,total=document.getElementById('mTotal').value,deposit=document.getElementById('mDeposit').value,notes=document.getElementById('mNotes').value;if(status==='CONFIRMED'){msg.className='error';msg.textContent='A booking can only become CONFIRMED after payment verification.';return;}if(status==='ACCEPTED'&&Number(deposit||0)>0)status='AWAITING_PAYMENT';try{await updateBookingStatus(id,status,{total_amount:total===''?null:Number(total),deposit_amount:deposit===''?0:Number(deposit),notes});msg.className='success';msg.textContent='Saved.';await renderRefresh();setTimeout(()=>{closeModal();openBooking(id)},500);}catch(e){msg.className='error';msg.textContent=e.message;}}
async function verifyPayment(paymentId){const ref=prompt('Confirm the transaction/reference number (optional):','');const {data:bookingId,error}=await supabaseClient.rpc('confirm_booking_payment',{p_payment_id:paymentId,p_reference:ref||null});if(error){alert(error.message);return;}if(bookingId && location.protocol!=='file:') fetch('../api/notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:'payment_confirmed',booking_id:bookingId})}).catch(err=>console.warn('Customer confirmation email failed:',err));alert('Payment verified. Booking is now CONFIRMED. The customer will be notified.');await renderRefresh();closeModal();}
async function renderRefresh(){const {data}=await supabaseClient.from('bookings').select('*, packages(name)').order('event_date',{ascending:true});bookings=data||[];filterRows();}function closeModal(){document.getElementById('modal').classList.add('hidden');}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script></body></html>
