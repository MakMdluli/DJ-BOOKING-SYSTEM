<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bookings | Scorpion_Jr Admin</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="admin-shell"><div class="container admin-main"><div class="nav"><a href="../index.html"><img class="logo" src="../assets/logo.png" alt="Scorpion_Jr"></a></div><nav class="admin-nav"><a href="dashboard.html">Dashboard</a><a href="bookings.html">Bookings</a><a href="calendar.html">Calendar</a><a href="clients.html">Clients</a><a href="packages.html">Packages</a><a href="payments.html">Payments</a><a href="reviews.html">Reviews</a><a href="settings.html">Settings</a><a href="#" onclick="adminSignOut();return false;">Sign out</a></nav><section><h1>Booking Requests</h1><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Client</th><th>Event</th><th>Venue</th><th>Status</th></tr></thead><tbody id="bookingRows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></section></div></main><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script>
(async()=>{const a=await requireAdmin();if(!a)return;const {data,error}=await supabaseClient.from("bookings").select("id,event_date,client_name,event_type,venue,status").order("event_date",{ascending:true});const body=document.getElementById("bookingRows");if(error){body.innerHTML="<tr><td colspan='5'>"+error.message+"</td></tr>";return;}body.innerHTML=data.map(b=>`<tr><td>${b.event_date}</td><td>${esc(b.client_name)}</td><td>${esc(b.event_type)}</td><td>${esc(b.venue)}</td><td><span class="status">${b.status}</span></td></tr>`).join("")||"<tr><td colspan='5'>No bookings yet.</td></tr>";function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}})();
</script></body></html>
