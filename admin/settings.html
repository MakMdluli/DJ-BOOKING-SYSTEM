<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings | Scorpion_Jr</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="admin-shell"><div class="container admin-main"></div></main><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/admin.js"></script><script>
(async()=>{
 const a=await loadAdminShell(); if(!a)return;
 document.querySelector('.admin-main').insertAdjacentHTML('beforeend',`<section><div class="page-head"><div><span class="eyebrow">SYSTEM</span><h1>Settings</h1><p class="muted">Manage booking workflow and customer payment details.</p></div></div><div class="grid"><div class="card"><h3>Signed-in admin</h3><p>${esc(a.profile.full_name||a.user.email)}</p><p class="muted">${esc(a.user.email)}</p></div><div class="card"><h3>Booking workflow</h3><p>PENDING → ACCEPTED → AWAITING_PAYMENT → CONFIRMED → COMPLETED</p><p class="muted">Requests can also be DECLINED or CANCELLED.</p></div><div class="card"><h3>Equipment policy</h3><p>DJ service only. Sound, lighting and other equipment are not included unless separately agreed.</p></div></div><div class="card" style="margin-top:1rem"><h2>Payment details</h2><p class="muted">These details are shown to customers after their booking is accepted. Keep them up to date.</p><form id="paymentSettingsForm" class="form-grid"><label>eMali number<input id="emali_number" placeholder="e.g. 76123456"></label><label>eMali account name<input id="emali_name" placeholder="Account name"></label><label>MoMo number<input id="momo_number" placeholder="MTN MoMo number"></label><label>MoMo account name<input id="momo_name" placeholder="Account name"></label><label>Bank name<input id="bank_name" placeholder="Bank name"></label><label>Bank account name<input id="bank_account_name" placeholder="Account name"></label><label>Bank account number<input id="bank_account_number" placeholder="Account number"></label><label>Branch<input id="bank_branch" placeholder="Branch"></label><label style="grid-column:1/-1">Payment instructions<textarea id="payment_instructions" rows="4" placeholder="Example: Use your booking reference as the payment reference. Send proof of payment if requested."></textarea></label><button class="btn" type="submit">Save payment details</button><p id="paymentMsg"></p></form></div></section>`);
 const {data}=await supabaseClient.from('payment_settings').select('*').eq('id',1).maybeSingle();
 if(data) for(const k of ['emali_number','emali_name','momo_number','momo_name','bank_name','bank_account_name','bank_account_number','bank_branch','payment_instructions']) document.getElementById(k).value=data[k]||'';
 document.getElementById('paymentSettingsForm').addEventListener('submit',async e=>{
   e.preventDefault(); const msg=document.getElementById('paymentMsg'); msg.textContent='Saving…';
   const payload={id:1}; for(const k of ['emali_number','emali_name','momo_number','momo_name','bank_name','bank_account_name','bank_account_number','bank_branch','payment_instructions']) payload[k]=document.getElementById(k).value.trim();
   const {error}=await supabaseClient.from('payment_settings').upsert(payload);
   msg.className=error?'error':'success'; msg.textContent=error?error.message:'Payment details saved.';
 });
})();
</script></body></html>
