<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard | Scorpion_Jr Admin</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="admin-shell"><div class="container admin-main"><div class="nav"><a href="../index.html"><img class="logo" src="../assets/logo.png" alt="Scorpion_Jr"></a></div><nav class="admin-nav"><a href="dashboard.html">Dashboard</a><a href="bookings.html">Bookings</a><a href="calendar.html">Calendar</a><a href="clients.html">Clients</a><a href="packages.html">Packages</a><a href="payments.html">Payments</a><a href="reviews.html">Reviews</a><a href="settings.html">Settings</a><a href="#" onclick="adminSignOut();return false;">Sign out</a></nav><section><span class="eyebrow">ADMIN</span><h1>Booking Dashboard</h1><div class="grid"><div class="card"><h3>Pending requests</h3><strong id="pendingCount">—</strong></div><div class="card"><h3>Confirmed</h3><strong id="confirmedCount">—</strong></div><div class="card"><h3>Upcoming</h3><strong id="upcomingCount">—</strong></div></div></section></div></main><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script>
(async()=>{const a=await requireAdmin();if(!a)return;const {data}=await supabaseClient.from("bookings").select("status,event_date");if(!data)return;document.getElementById("pendingCount").textContent=data.filter(x=>x.status==="PENDING").length;document.getElementById("confirmedCount").textContent=data.filter(x=>x.status==="CONFIRMED").length;document.getElementById("upcomingCount").textContent=data.filter(x=>x.event_date>=new Date().toISOString().slice(0,10)&&!["DECLINED","CANCELLED","COMPLETED"].includes(x.status)).length;})();
</script></body></html>
