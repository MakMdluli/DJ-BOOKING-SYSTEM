<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoices | Scorpion_Jr</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="admin-shell"><div class="container admin-main"></div></main><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/admin.js"></script><script>
(async()=>{if(!await loadAdminShell())return;await renderInvoices();})();
async function renderInvoices(){const {data,error}=await supabaseClient.from('invoices').select('*, bookings(client_name,event_type,event_date,venue,payment_token,total_amount,deposit_amount)').order('created_at',{ascending:false});const main=document.querySelector('.admin-main');main.insertAdjacentHTML('beforeend',`<section><div class="page-head"><div><span class="eyebrow">FINANCE</span><h1>Invoice Tracker</h1><p class="muted">Invoices are created automatically when a booking becomes confirmed. Payments update the amount paid and balance.</p></div></div>${error?`<div class="card error">${esc(error.message)}<p>Run <b>supabase-v6-upgrade.sql</b> in Supabase first.</p></div>`:`<div class="table-wrap"><table class="table"><thead><tr><th>Invoice</th><th>Client</th><th>Event</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th><th></th></tr></thead><tbody>${(data||[]).map(i=>`<tr><td><strong>${esc(i.invoice_number)}</strong><div class="muted">${new Date(i.issued_at).toLocaleDateString()}</div></td><td>${esc(i.bookings?.client_name||'—')}</td><td>${esc(i.bookings?.event_type||'—')}<div class="muted">${fmtDate(i.bookings?.event_date)}</div></td><td>E ${money(i.total_amount)}</td><td>E ${money(i.amount_paid)}</td><td>E ${money(i.balance_due)}</td><td><span class="status status-${String(i.status).toLowerCase().replace(/_/g,'-')}">${esc(i.status)}</span></td><td><a class="btn small" target="_blank" href="../documents.html?token=${encodeURIComponent(i.bookings?.payment_token||'')}">VIEW DOCUMENTS</a></td></tr>`).join('')||'<tr><td colspan="8" class="muted">No invoices yet. An invoice appears after the first booking is confirmed.</td></tr>'}</tbody></table></div>`}</section>`)}
</script></body></html>
