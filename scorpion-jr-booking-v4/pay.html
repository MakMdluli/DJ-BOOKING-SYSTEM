<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay Deposit | Scorpion_Jr</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="site-shell"><div class="container narrow"><a class="back" href="index.html">← Scorpion_Jr</a><section class="hero-card"><span class="eyebrow">SECURE PAYMENT REQUEST</span><h1>Pay your booking deposit</h1><div id="booking" class="card">Loading booking…</div><div id="paybox" class="card hidden"></div></section></div></main><script src="js/supabase.js"></script><script>
const token=new URLSearchParams(location.search).get('token');let booking=null;
(async()=>{if(!token){document.getElementById('booking').textContent='Invalid payment link.';return;}const {data,error}=await supabaseClient.rpc('get_payment_booking',{p_token:token});if(error||!data?.length){document.getElementById('booking').textContent='This payment link is invalid or expired.';return;}booking=data[0];document.getElementById('booking').innerHTML=`<h2>${esc(booking.client_name)}</h2><p><b>${esc(booking.event_type)}</b><br>${fmtDate(booking.event_date)} · ${fmtTime(booking.start_time)}–${fmtTime(booking.end_time)}<br>${esc(booking.venue)}</p><div class="notice"><b>Deposit required: E ${money(booking.deposit_amount)}</b><br>Payment confirms your booking only after the payment has been verified.</div>`;if(booking.status!=='AWAITING_PAYMENT'){document.getElementById('paybox').classList.remove('hidden');document.getElementById('paybox').innerHTML=`<h3>Booking status</h3><p>Your booking is currently <b>${esc(booking.status)}</b>.</p>`;return;}showPay();})();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function money(v){return Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}function fmtDate(v){return new Date(v+'T00:00:00').toLocaleDateString(undefined,{day:'2-digit',month:'long',year:'numeric'});}function fmtTime(v){return v?String(v).slice(0,5):'—';}
function showPay(){const box=document.getElementById('paybox');box.classList.remove('hidden');box.innerHTML=`<h2>Choose payment method</h2><p class="muted">Select how you intend to pay. We will verify the transaction before confirming your booking.</p><div class="form-grid"><button class="btn" onclick="choose('MOMO')">MTN MoMo / MoMoPay</button><button class="btn" onclick="choose('EMALI')">eMali</button><button class="btn" onclick="choose('BANK')">Bank payment / EFT</button></div><div id="method"></div>`;}
function choose(method){const labels={MOMO:'MTN MoMo / MoMoPay',EMALI:'eMali',BANK:'Bank payment / EFT'};document.getElementById('method').innerHTML=`<div class="notice"><b>${labels[method]}</b><br>${method==='MOMO'?'Enter the MTN MoMo number that will pay the deposit. We will send a payment request to that wallet.':'Complete the payment using the selected service, then enter the transaction/reference number below.'}</div>${method==='MOMO'?'<label>MTN MoMo number</label><input id="momoPhone" placeholder="e.g. 76123456" inputmode="tel">':'<label>Payment/reference number</label><input id="ref" placeholder="Transaction reference">'}<button class="btn" onclick="submitIntent('${method}')">${method==='MOMO'?'Request MoMo payment':'I have made the payment'}</button><p id="msg"></p>`;}
async function submitIntent(method){const msg=document.getElementById('msg');msg.textContent='Submitting…';const ref=document.getElementById('ref')?.value.trim()||null;const {data,error}=await supabaseClient.rpc('submit_payment_intent',{p_token:token,p_method:method,p_reference:ref,p_amount:Number(booking.deposit_amount)});if(error){msg.className='error';msg.textContent=error.message;return;}if(method==='MOMO'){const phone=document.getElementById('momoPhone').value.trim();const r=await fetch(`${SUPABASE_URL}/functions/v1/momo-request-payment`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},body:JSON.stringify({token,payment_id:data,phone})});const j=await r.json();if(!r.ok){msg.className='error';msg.textContent=j.error||'Could not start MoMo payment.';return;}msg.className='success';msg.textContent='MoMo payment request sent. Approve it on your phone. Your booking will be confirmed automatically after MTN reports a successful payment.';}else{msg.className='success';msg.textContent='Payment submitted for verification. You will receive confirmation once the transaction is verified.';}}
</script></body></html>
