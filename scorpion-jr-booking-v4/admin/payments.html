<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments | Scorpion_Jr</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="admin-shell"><div class="container admin-main"></div></main><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/admin.js"></script><script>
(async()=>{if(!await loadAdminShell())return;await renderPayments();})();
async function renderPayments(){const {data,error}=await supabaseClient.from('payments').select('*, bookings(client_name,event_date,status,deposit_amount)').order('created_at',{ascending:false});const main=document.querySelector('.admin-main');main.insertAdjacentHTML('beforeend',`<section><div class="page-head"><div><span class="eyebrow">FINANCE</span><h1>Payments</h1><p class="muted">Verify customer payments. A verified required deposit automatically confirms the booking.</p></div></div>${error?`<div class="card error">${esc(error.message)}</div>`:`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Client</th><th>Method</th><th>Amount</th><th>Status</th><th>Reference</th><th></th></tr></thead><tbody>${(data||[]).map(p=>`<tr><td>${new Date(p.created_at).toLocaleString()}</td><td>${esc(p.bookings?.client_name||'—')}</td><td>${esc(p.payment_method||'BANK')}</td><td>E ${money(p.amount)}</td><td><span class="${statusClass(p.payment_status)}">${esc(p.payment_status)}</span></td><td>${esc(p.reference||'—')}</td><td>${p.payment_status==='PENDING'?`<button class="btn small" onclick="verify('${p.id}')">Verify payment</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">No payments recorded yet.</td></tr>'}</tbody></table></div>`}</section>`);}
async function verify(id){const ref=prompt('Confirm the transaction/reference number (optional):','');const {error}=await supabaseClient.rpc('confirm_booking_payment',{p_payment_id:id,p_reference:ref||null});if(error){alert(error.message);return;}alert('Payment verified. Booking confirmed.');location.reload();}
</script></body></html>
