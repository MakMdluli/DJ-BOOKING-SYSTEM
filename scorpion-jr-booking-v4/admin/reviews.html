<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviews | Scorpion_Jr</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="admin-shell"><div class="container admin-main"></div></main><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/admin.js"></script><script>
(async()=>{if(!await loadAdminShell())return;const {data,error}=await supabaseClient.from('reviews').select('*').order('created_at',{ascending:false});const main=document.querySelector('.admin-main');main.insertAdjacentHTML('beforeend',`<section><div class="page-head"><div><span class="eyebrow">SOCIAL PROOF</span><h1>Reviews</h1><p class="muted">Approve reviews before they appear publicly.</p></div></div>${error?`<div class="card error">${esc(error.message)}</div>`:`<div class="review-grid">${(data||[]).map(r=>`<div class="card"><div class="card-head"><h3>${esc(r.client_name)}</h3><span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span></div><p>${esc(r.review_text)}</p><p class="muted">${new Date(r.created_at).toLocaleDateString()}</p><button class="btn small" onclick="publishReview('${r.id}',${!r.published})">${r.published?'Unpublish':'Publish'}</button></div>`).join('')||'<div class="card muted">No reviews yet.</div>'}</div>`}</section>`);})();
async function publishReview(id,published){const {error}=await supabaseClient.from('reviews').update({published}).eq('id',id);if(error)alert(error.message);else location.reload();}
</script></body></html>
