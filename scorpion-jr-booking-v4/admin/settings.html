<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings | Scorpion_Jr</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="admin-shell"><div class="container admin-main"></div></main><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/admin.js"></script><script>
