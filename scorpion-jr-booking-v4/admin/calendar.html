<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar | Scorpion_Jr</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="admin-shell"><div class="container admin-main"></div></main><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/admin.js"></script><script>
(async()=>{if(!await loadAdminShell())return;const {data,error}=await supabaseClient.from('bookings').select('*').in('status',['ACCEPTED','AWAITING_DEPOSIT','CONFIRMED']).order('event_date').order('start_time');const main=document.querySelector('.admin-main');main.insertAdjacentHTML('beforeend',`<section><div class="page-head"><div><span class="eyebrow">SCHEDULE</span><h1>Calendar</h1><p class="muted">Accepted, deposit-pending and confirmed events are shown here.</p></div></div>${error?`<div class="card error">${esc(error.message)}</div>`:`<div class="calendar-list">${(data||[]).map(x=>`<div class="card calendar-event"><div class="calendar-date"><strong>${new Date(x.event_date+'T00:00:00').getDate()}</strong><span>${new Date(x.event_date+'T00:00:00').toLocaleDateString(undefined,{month:'short'})}</span></div><div><h3>${esc(x.event_type)}</h3><p>${esc(x.client_name)} · ${esc(x.venue)}, ${esc(x.location)}</p><p class="muted">${fmtTime(x.start_time)}–${fmtTime(x.end_time)} · <span class="${statusClass(x.status)}">${esc(x.status)}</span></p></div></div>`).join('')||'<div class="card muted">No scheduled events yet.</div>'}</div>`}</section>`);})();
</script></body></html>
