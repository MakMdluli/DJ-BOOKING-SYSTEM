<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Packages | Scorpion_Jr</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="admin-shell"><div class="container admin-main"></div></main><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/admin.js"></script><script>
(async()=>{if(!await loadAdminShell())return;renderPackages();})();
async function renderPackages(){const {data,error}=await supabaseClient.from('packages').select('*').order('created_at');const main=document.querySelector('.admin-main');main.insertAdjacentHTML('beforeend',`<section><div class="page-head"><div><span class="eyebrow">SERVICES</span><h1>Packages</h1><p class="muted">Control the packages customers can select when booking.</p></div><button class="btn" onclick="openPackage()">Add package</button></div><div class="grid package-grid">${error?`<div class="card error">${esc(error.message)}</div>`:(data||[]).map(p=>`<div class="card"><div class="card-head"><h2>${esc(p.name)}</h2><span class="${p.active?'status status-confirmed':'status'}">${p.active?'ACTIVE':'HIDDEN'}</span></div><p>${esc(p.description||'')}</p><p><strong>${Number(p.price||0)>0?money(p.price):'Quote on request'}</strong> · ${esc(p.duration_hours||0)} hrs</p><div class="actions"><button class="btn small" onclick='openPackage(${JSON.stringify(p)})'>Edit</button><button class="btn secondary small" onclick="togglePackage('${p.id}',${!p.active})">${p.active?'Hide':'Activate'}</button></div></div>`).join('')}</div></section>`);}
function openPackage(p=null){const main=document.querySelector('.admin-main');const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modal-box"><button class="modal-close" onclick="this.closest('.modal').remove()">×</button><h2>${p?'Edit':'Add'} package</h2><form id="pkgForm" class="form-grid compact"><div class="full"><label>Name</label><input id="pName" required value="${esc(p?.name||'')}"></div><div class="full"><label>Description</label><textarea id="pDesc">${esc(p?.description||'')}</textarea></div><div><label>Price</label><input id="pPrice" type="number" min="0" step="0.01" value="${p?.price??0}"></div><div><label>Duration (hours)</label><input id="pHours" type="number" min="0.5" step="0.5" value="${p?.duration_hours??4}"></div><div class="full"><label><input id="pActive" type="checkbox" style="width:auto" ${p?.active!==false?'checked':''}> Active</label></div><div class="full"><button class="btn">Save package</button></div><p id="pMsg" class="full"></p></form></div>`;document.body.appendChild(m);document.getElementById('pkgForm').onsubmit=async e=>{e.preventDefault();const row={name:pName.value.trim(),description:pDesc.value.trim(),price:Number(pPrice.value||0),duration_hours:Number(pHours.value||0),active:pActive.checked};const q=p?supabaseClient.from('packages').update(row).eq('id',p.id):supabaseClient.from('packages').insert(row);const {error}=await q;const msg=document.getElementById('pMsg');if(error){msg.className='error';msg.textContent=error.message;}else{m.remove();location.reload();}};}
async function togglePackage(id,active){const {error}=await supabaseClient.from('packages').update({active}).eq('id',id);if(error)alert(error.message);else location.reload();}
</script></body></html>
