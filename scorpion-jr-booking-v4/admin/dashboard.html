<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Scorpion_Jr</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="admin-shell"><div class="container admin-main"></div></main><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/admin.js"></script><script>
(async()=>{if(!await loadAdminShell())return;await renderDashboard();})();
async function renderDashboard(){const {data,error}=await supabaseClient.from('bookings').select('*').order('event_date',{ascending:true});if(error){document.querySelector('.admin-main').insertAdjacentHTML('beforeend',`<div class="card error">${esc(error.message)}</div>`);return;}const today=new Date().toISOString().slice(0,10);const pending=data.filter(x=>x.status==='PENDING').length,confirmed=data.filter(x=>x.status==='CONFIRMED').length,awaiting=data.filter(x=>x.status==='AWAITING_PAYMENT').length,upcoming=data.filter(x=>x.event_date>=today&&!['DECLINED','CANCELLED','COMPLETED'].includes(x.status)).length;const main=document.querySelector('.admin-main');main.insertAdjacentHTML('beforeend',`<section><div class="page-head"><div><span class="eyebrow">OVERVIEW</span><h1>Booking Dashboard</h1><p class="muted">Payment-confirmed bookings and DJ notifications.</p></div><a class="btn" href="bookings.html">Manage bookings</a></div><div class="grid stats-grid"><div class="card stat"><span>Pending requests</span><strong>${pending}</strong></div><div class="card stat"><span>Awaiting payment</span><strong>${awaiting}</strong></div><div class="card stat"><span>Confirmed</span><strong>${confirmed}</strong></div><div class="card stat"><span>Upcoming</span><strong>${upcoming}</strong></div></div><div class="card"><div class="card-head"><h2>Next bookings</h2><a href="calendar.html">Open calendar</a></div>${data.filter(x=>x.event_date>=today&&!['DECLINED','CANCELLED','COMPLETED'].includes(x.status)).slice(0,6).map(x=>`<div class="list-row"><div><strong>${esc(x.client_name)}</strong><div class="muted">${esc(x.event_type)} · ${fmtDate(x.event_date)} · ${fmtTime(x.start_time)}–${fmtTime(x.end_time)}</div></div><span class="${statusClass(x.status)}">${esc(x.status)}</span></div>`).join('')||'<p class="muted">No upcoming bookings.</p>'}</div></section><section><div class="page-head"><div><span class="eyebrow">DJ NOTIFICATIONS</span><h2>Recent notifications</h2></div></div><div id="notifications" class="grid"></div></section>`);await renderNotifications();}
async function renderNotifications(){const n=await loadNotifications();const el=document.getElementById('notifications');el.innerHTML=n.map(x=>`<div class="card"><div class="card-head"><strong>${esc(x.title)}</strong><small class="muted">${new Date(x.created_at).toLocaleString()}</small></div><p>${esc(x.message)}</p>${!x.read_at?`<button class="btn small" onclick="readNotification('${x.id}')">Mark read</button>`:'<span class="muted">Read</span>'}</div>`).join('')||'<div class="muted">No notifications.</div>';}
async function readNotification(id){await markNotificationRead(id);await renderNotifications();}
</script></body></html>
