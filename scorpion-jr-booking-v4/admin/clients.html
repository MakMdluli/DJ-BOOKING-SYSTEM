<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clients | Scorpion_Jr</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="admin-shell"><div class="container admin-main"></div></main><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/admin.js"></script><script>
(async()=>{if(!await loadAdminShell())return;const {data,error}=await supabaseClient.from('bookings').select('client_name,whatsapp,email,event_date,status').order('event_date',{ascending:false});const map=new Map();(data||[]).forEach(b=>{const k=(b.email||b.whatsapp||b.client_name).toLowerCase();if(!map.has(k))map.set(k,{...b,count:0});map.get(k).count++;});document.querySelector('.admin-main').insertAdjacentHTML('beforeend',`<section><div class="page-head"><div><span class="eyebrow">CLIENTS</span><h1>Clients</h1><p class="muted">Clients are grouped automatically from booking requests.</p></div></div>${error?`<div class="card error">${esc(error.message)}</div>`:`<div class="table-wrap"><table class="table"><thead><tr><th>Client</th><th>WhatsApp</th><th>Email</th><th>Bookings</th><th>Last event</th><th>Status</th></tr></thead><tbody>${Array.from(map.values()).map(c=>`<tr><td><strong>${esc(c.client_name)}</strong></td><td>${esc(c.whatsapp)}</td><td>${esc(c.email)}</td><td>${c.count}</td><td>${fmtDate(c.event_date)}</td><td><span class="${statusClass(c.status)}">${esc(c.status)}</span></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No clients yet.</td></tr>'}</tbody></table></div>`}</section>`);})();
</script></body></html>
